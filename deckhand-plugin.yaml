schema_version: 1
id: dh-prometheus
name: Prometheus
version: 0.1.0
api_version: 1
description: Read-only scalar, alert, and target observation through logical checks.
adapters:
  - dh-prometheus.read
status_provider_types:
  - prometheus-check
actions:
  - prometheus.check.observe
permissions:
  mutation: false
  credential_slots:
    - prometheus.bearer_token
    - prometheus.tls_ca
  egress_bindings:
    - endpoint
config_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required:
    - endpoint
    - checks
  properties:
    endpoint:
      type: string
      format: uri
      pattern: ^https://
    bearer_token_file:
      type: string
      pattern: ^/
    verify_tls:
      type: boolean
      default: true
    ca_file:
      type: string
      pattern: ^/
    timeout_seconds:
      type: number
      exclusiveMinimum: 0
      maximum: 30
    checks:
      type: object
      minProperties: 1
      propertyNames:
        pattern: ^[a-z][a-z0-9_]{0,63}$
      additionalProperties:
        type: object
        additionalProperties: false
        required:
          - kind
        properties:
          kind:
            enum:
              - scalar
              - alerts
              - targets
          expression:
            type: string
            minLength: 1
            maxLength: 2048
          operator:
            enum:
              - gt
              - ge
              - lt
              - le
              - eq
              - ne
          threshold:
            type: number
          match_labels:
            type: object
            maxProperties: 16
            propertyNames:
              pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
            additionalProperties:
              type: string
              minLength: 1
              maxLength: 256
          job:
            type: string
            minLength: 1
            maxLength: 256
          stale_after_seconds:
            type: integer
            minimum: 1
            maximum: 3600
        allOf:
          - if:
              properties:
                kind:
                  const: scalar
            then:
              required:
                - expression
                - operator
                - threshold
              not:
                anyOf:
                  - required:
                      - match_labels
                  - required:
                      - job
          - if:
              properties:
                kind:
                  const: alerts
            then:
              not:
                anyOf:
                  - required:
                      - expression
                  - required:
                      - operator
                  - required:
                      - threshold
                  - required:
                      - job
          - if:
              properties:
                kind:
                  const: targets
            then:
              not:
                anyOf:
                  - required:
                      - expression
                  - required:
                      - operator
                  - required:
                      - threshold
                  - required:
                      - match_labels
